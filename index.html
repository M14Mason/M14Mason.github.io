<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mason Ngo Apps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every app Mason Ngo has built: markets, learning tools, ventures and creative work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with a live price line, three featured apps, then the shelf grouped by purpose. Each app owns a color and a drawn preview of what it does. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#11151d; --muted:#596274; --line:#dde2ea; --soft:#eef1f6; --accent:#2b55d6;
  --mix:#11151d; --mixamt:0%;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e14; --surface:#131821; --fg:#e9ecf2; --muted:#949db0; --line:#252c39; --soft:#1a202b; --accent:#8ca5ff; --mix:#ffffff; --mixamt:30%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e14; --surface:#131821; --fg:#e9ecf2; --muted:#949db0; --line:#252c39; --soft:#1a202b; --accent:#8ca5ff; --mix:#ffffff; --mixamt:30%; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.band{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:1160px;margin:0 auto}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .inner{position:relative;padding-block:72px 52px;display:flex;flex-direction:column;gap:18px}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.live{width:8px;height:8px;border-radius:50%;background:#16a37b;animation:pulse 2.4s ease-out infinite}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,9vw,92px);line-height:.95;letter-spacing:-.035em;margin:0;text-wrap:balance;max-width:12ch}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);font-size:clamp(16px,2vw,18px);margin:0;max-width:54ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb, var(--surface) 82%, transparent);backdrop-filter:blur(6px);min-width:100px;color:inherit;text-decoration:none}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.bar .inner{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.bar .inner::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--bg);border-color:var(--fg);background:var(--fg)}
.chip small{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

/* sections */
main .inner{padding-block:44px 72px;display:flex;flex-direction:column;gap:52px}
section{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:4px;max-width:60ch}
h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.015em;margin:0}
.sec-head p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.feat{grid-template-columns:1fr}}

/* card: every app sets --c, its own color */
.card{--cc:color-mix(in srgb, var(--c) calc(100% - var(--mixamt)), var(--mix));
  position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb, var(--cc) 60%, var(--line));box-shadow:0 22px 44px -30px var(--cc)}
.card:focus-visible,.chip:focus-visible,.stat:focus-visible,footer a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.art{position:relative;aspect-ratio:2/1;max-width:100%;background:
  radial-gradient(120% 90% at 85% 0%, color-mix(in srgb, var(--cc) 22%, transparent), transparent 60%),
  color-mix(in srgb, var(--cc) 7%, var(--surface));border-bottom:1px solid color-mix(in srgb, var(--cc) 18%, var(--line));overflow:hidden}
.art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb, var(--cc) 22%, transparent) 1px, transparent 1px);background-size:14px 14px;opacity:.55;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.art svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .art svg{transform:scale(1.035)}
/* drawing classes used inside each preview */
.art .s{fill:none;stroke:var(--cc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art .t{fill:none;stroke:var(--cc);stroke-width:1.4;stroke-linecap:round;opacity:.45}
.art .f{fill:var(--cc)}
.art .fs{fill:var(--cc);opacity:.16}
.art .fm{fill:var(--cc);opacity:.45}
.art .p{fill:var(--surface);stroke:color-mix(in srgb, var(--cc) 35%, var(--line));stroke-width:1.2}
.art .g{fill:var(--muted);opacity:.28}
.art .gl{fill:none;stroke:var(--muted);stroke-opacity:.3;stroke-width:1.2;stroke-linecap:round}
.art text{font-family:var(--mono);font-size:10px;fill:var(--cc)}
.art text.d{font-family:var(--display);font-weight:700}

.body{display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h3{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.015em;margin:0;line-height:1.15}
.status{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:#16a37b}
.status.limited i{background:#d08a1c}
.what{margin:0;color:var(--muted);flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--cc)}
.go{flex:none;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px;color:var(--fg)}
.go svg{transition:transform .3s}
.card:hover .go svg{transform:translate(3px,-3px)}
.card.big h3{font-size:24px}
.card.big .art{aspect-ratio:16/9}
.card.big .what{color:var(--fg);opacity:.8;font-size:15.5px}

/* card actions */
button.art{display:block;width:100%;padding:0;border:0;border-bottom:1px solid color-mix(in srgb, var(--cc) 18%, var(--line));cursor:pointer;font:inherit;color:inherit}
.acts{display:flex;align-items:center;gap:12px;flex:none}
.more{font:500 13px var(--body);color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.more:hover{border-color:var(--cc);color:var(--cc)}
.go{text-decoration:none}
.go:hover{color:var(--cc)}
.more:focus-visible,.go:focus-visible,button.art:focus-visible,.x:focus-visible,.d-open:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* details sheet */
.sheet:not(.on){pointer-events:none}
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.scrim{position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 55%, #000 45%);opacity:0;transition:opacity .22s;backdrop-filter:blur(4px)}
.panel{--cc:color-mix(in srgb, var(--c) calc(100% - var(--mixamt)), var(--mix));position:relative;width:min(720px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.6);opacity:0;transform:translateY(16px) scale(.98);transition:opacity .22s,transform .3s cubic-bezier(.2,.7,.2,1);outline:none}
.sheet.on .scrim{opacity:1}
.sheet.on .panel{opacity:1;transform:none}
.d-art{position:relative;aspect-ratio:12/5;max-width:100%;background:radial-gradient(120% 90% at 85% 0%, color-mix(in srgb, var(--cc) 24%, transparent), transparent 60%),color-mix(in srgb, var(--cc) 8%, var(--surface));border-bottom:1px solid var(--line)}
.d-art svg{position:absolute;inset:0;width:100%;height:100%}
.d-art .s{fill:none;stroke:var(--cc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d-art .t{fill:none;stroke:var(--cc);stroke-width:1.4;stroke-linecap:round;opacity:.45}
.d-art .f{fill:var(--cc)} .d-art .fs{fill:var(--cc);opacity:.16} .d-art .fm{fill:var(--cc);opacity:.45}
.d-art .p{fill:var(--surface);stroke:color-mix(in srgb, var(--cc) 35%, var(--line));stroke-width:1.2}
.d-art .g{fill:var(--muted);opacity:.28} .d-art .gl{fill:none;stroke:var(--muted);stroke-opacity:.3;stroke-width:1.2}
.d-art text{font-family:var(--mono);font-size:10px;fill:var(--cc)} .d-art text.d{font-family:var(--display);font-weight:700}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.d-inner{padding:24px;display:flex;flex-direction:column;gap:16px}
.d-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.d-meta .tag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--cc)}
#d-name{font-size:clamp(26px,4vw,34px);letter-spacing:-.02em}
.d-what{margin:0;color:var(--muted);font-size:16px}
.d-best{border-radius:12px;padding:14px 16px;background:color-mix(in srgb, var(--cc) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--cc) 25%, var(--line))}
.d-best span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.d-best p{margin:4px 0 0;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35}
.d-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:620px){.d-cols{grid-template-columns:1fr}}
h4{margin:0 0 8px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-cols ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.d-cols li{position:relative;padding-left:20px}
.d-cols li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--cc);opacity:.8}
.d-side{display:flex;flex-direction:column;gap:16px}
.d-side p{margin:0}
.d-big{font-family:var(--display);font-weight:700;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.d-open{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--cc);color:var(--surface);text-decoration:none;font-weight:500}
.d-open:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion: reduce){.scrim,.panel{transition:none}}

footer{border-top:1px solid var(--line)}
footer .inner{padding-block:22px 36px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}

@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,123,.55)}100%{box-shadow:0 0 0 10px rgba(22,163,123,0)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
.art .blink{animation:blink 1.6s steps(2) infinite}
.art .sweep{transform-origin:62px 60px;animation:spin 6s linear infinite}
@media (prefers-reduced-motion: reduce){.card,.live,.art .blink,.art .sweep{animation:none}.card,.art svg,.go svg{transition:none}.card:hover{transform:none}.card:hover .art svg{transform:none}}
</style>
</head>
<body>

<header class="hero band">
  <canvas id="tape" aria-hidden="true"></canvas>
  <div class="inner">
    <div class="kicker"><span class="live" aria-hidden="true"></span>Mason Ngo · student developer</div>
    <h1>Things I've <em>built</em>.</h1>
    <p class="lede">I build tools for trading, studying and small businesses, mostly because I wanted them to exist. Every card below opens a working app.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<nav class="bar band" aria-label="Filter apps by category"><div class="inner" id="filters"></div></nav>

<main class="band"><div class="inner" id="groups"></div></main>

<footer class="band"><div class="inner"><span>© 2026 Mason Ngo</span><span>Code on <a href="https://github.com/M14Mason">GitHub</a></span></div></footer>

<script>
const CATS = [
  {id:"markets",  name:"Markets",  blurb:"Tools I use to research stocks and follow the market."},
  {id:"learning", name:"Learning", blurb:"Study apps built around how I actually learn: short lessons, practice and spaced review."},
  {id:"ventures", name:"Ventures", blurb:"Products built to be businesses, from prototype to waitlist."},
  {id:"tools",    name:"Tools",    blurb:"Everyday utilities for school, training and side hustles."},
  {id:"creative", name:"Creative", blurb:"My own work outside of code."}
];

/* Each preview is a 240 x 120 drawing of what the app does. */
const ART = {
  meridian:`<rect class="p" x="14" y="12" width="212" height="96" rx="8"/>
    <rect class="fs" x="14" y="12" width="212" height="16" rx="8"/><circle class="fm" cx="25" cy="20" r="2.5"/><circle class="fm" cx="33" cy="20" r="2.5"/><circle class="fm" cx="41" cy="20" r="2.5"/>
    <text x="56" y="23">SPX 6,012 ▲0.8%</text><text x="150" y="23" class="blink">● LIVE</text>
    <g>${[[30,70,52,84],[42,60,46,72],[54,56,40,64],[66,64,50,70],[78,50,36,58],[90,46,40,52],[102,54,44,62],[114,40,30,48],[126,36,28,44]].map(([x,o,h,c],i)=>`<line class="t" x1="${x}" x2="${x}" y1="${h-6}" y2="${c+8}"/><rect class="${i%3==2?'fm':'f'}" x="${x-3.5}" y="${Math.min(o,c)}" width="7" height="${Math.abs(o-c)+4}" rx="1"/>`).join("")}</g>
    <line class="gl" x1="146" y1="34" x2="146" y2="100"/>
    <rect class="fs" x="154" y="36" width="64" height="30" rx="5"/><text x="160" y="49">AI ANALYST</text><rect class="g" x="160" y="55" width="48" height="4" rx="2"/>
    <rect class="g" x="154" y="74" width="64" height="4" rx="2"/><rect class="g" x="154" y="84" width="44" height="4" rx="2"/><rect class="g" x="154" y="94" width="54" height="4" rx="2"/>`,
  strata:`<rect class="p" x="20" y="14" width="200" height="92" rx="8"/>
    <rect class="fm" x="30" y="24" width="42" height="12" rx="6"/><rect class="fs" x="76" y="24" width="50" height="12" rx="6"/><rect class="fs" x="130" y="24" width="36" height="12" rx="6"/>
    <text x="34" y="33" style="fill:var(--surface)">RSI&lt;30</text>
    ${[0,1,2,3].map(i=>`<g transform="translate(0 ${46+i*14})"><rect class="${i==1||i==2?'fs':'g'}" x="30" y="0" width="180" height="10" rx="3" ${i==1||i==2?'':'style="opacity:.1"'}/><text x="36" y="8">${["AAPL","NVDA","AMD","MSFT"][i]}</text>${i==1||i==2?`<path class="s" d="M196 3l3 3 6-6"/>`:`<rect class="g" x="186" y="3" width="16" height="4" rx="2"/>`}<rect class="g" x="80" y="3" width="${40+i*12}" height="4" rx="2"/></g>`).join("")}`,
  radar:`<circle class="t" cx="62" cy="60" r="44"/><circle class="t" cx="62" cy="60" r="28"/><circle class="t" cx="62" cy="60" r="12"/>
    <g class="sweep"><path class="fs" d="M62 60 L62 16 A44 44 0 0 1 100 38 Z"/><line class="s" x1="62" y1="60" x2="62" y2="16"/></g>
    <circle class="f" cx="84" cy="34" r="3.5"/><circle class="fm" cx="40" cy="78" r="3"/><circle class="fm" cx="78" cy="88" r="2.5"/>
    <rect class="p" x="124" y="18" width="100" height="84" rx="8"/><text x="132" y="32">NOV</text>
    ${Array.from({length:20},(_,i)=>{const x=132+(i%5)*18,y=40+Math.floor(i/5)*14;return `<rect class="${[3,11,16].includes(i)?'f':'fs'}" x="${x}" y="${y}" width="13" height="10" rx="2"/>`}).join("")}`,
  forge:`<rect class="p" x="14" y="14" width="112" height="92" rx="8"/>
    <text x="22" y="30">sim.py</text>
    ${[[22,40,62],[30,52,74],[30,64,50],[22,76,82],[30,88,40]].map(([x,y,w],i)=>`<rect class="${i==1?'fm':'g'}" x="${x}" y="${y-4}" width="${w}" height="5" rx="2.5"/>`).join("")}
    <rect class="f blink" x="74" y="84" width="2" height="9"/>
    <line class="gl" x1="138" y1="96" x2="228" y2="96"/>
    ${[ -26,-14,-4,6,18,30 ].map((d,i)=>`<path class="${i==3?'s':'t'}" d="M140 64 C 165 ${64-d*.3}, 190 ${64+d*.6}, 226 ${64-d}"/>`).join("")}
    <circle class="f" cx="140" cy="64" r="3.5"/><text x="168" y="22">MONTE CARLO</text>`,
  deca:`<rect class="p" x="70" y="30" width="110" height="68" rx="8" transform="rotate(-8 125 64)"/>
    <rect class="p" x="66" y="26" width="110" height="68" rx="8" transform="rotate(-3 121 60)"/>
    <rect class="p" x="62" y="22" width="116" height="72" rx="8"/>
    <text x="74" y="38">Q 12 / 40</text><rect class="g" x="74" y="46" width="88" height="5" rx="2.5"/><rect class="g" x="74" y="56" width="64" height="5" rx="2.5"/>
    <rect class="fs" x="74" y="68" width="92" height="16" rx="5"/><path class="s" d="M80 76l4 4 8-8"/><text x="98" y="80">Net present value</text>
    <circle class="f" cx="196" cy="34" r="12"/><path d="M190 34l4 4 8-8" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`,
  pace:`<circle class="t" cx="84" cy="62" r="40" style="stroke-width:6;opacity:.18"/>
    <path class="s" style="stroke-width:6" d="M84 22 A40 40 0 1 1 46 74"/>
    <rect class="f" x="78" y="10" width="12" height="7" rx="2"/>
    <text x="64" y="60" class="d" style="font-size:20px">0:42</text><text x="68" y="76">7 x 8 = ?</text>

const $ = s => document.querySelector(s);
const catName = id => CATS.find(c => c.id === id).name;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9L9 3M4 3h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function card(a, i, big){
  const limited = !!a.status, idx = APPS.indexOf(a);
  return `<article class="card${big?" big":""}" style="--c:${a.c};--i:${i}">
    <button type="button" class="art" data-more="${idx}" aria-label="More about ${esc(a.name)}"><svg viewBox="0 0 240 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${ART[a.art]}</svg></button>
    <div class="body">
      <div class="top"><h3>${esc(a.name)}</h3><span class="status${limited?" limited":""}"><i></i>${limited?a.status:"Live"}</span></div>
      <p class="what">${esc(a.what)}</p>
      <div class="foot"><span class="tag">${a.tag} · ${a.started}</span>
        <span class="acts"><button type="button" class="more" data-more="${idx}">See more</button><a class="go" href="${a.url}" target="_blank" rel="noopener">${a.status==="Waitlist" ? "Join" : "Open"} ${arrow}</a></span></div>
    </div>
  </article>`;
}

/* details panel */
const sheet = document.createElement("div");
sheet.className = "sheet"; sheet.hidden = true;
sheet.innerHTML = `<div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="d-name" tabindex="-1"><div id="d-body"></div></div>`;
document.body.appendChild(sheet);
let lastFocus = null;
function openDetails(idx){
  const a = APPS[idx]; lastFocus = document.activeElement;
  const limited = !!a.status;
  sheet.querySelector(".panel").style.setProperty("--c", a.c);
  $("#d-body").innerHTML = `
    <div class="d-art"><svg viewBox="0 0 240 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${ART[a.art]}</svg>
      <button type="button" class="x" data-close aria-label="Close">×</button></div>
    <div class="d-inner">
      <div class="d-meta"><span class="tag">${a.tag}</span><span class="status${limited?" limited":""}"><i></i>${limited?a.status:"Live"}</span></div>
      <h3 id="d-name">${esc(a.name)}</h3>
      <p class="d-what">${esc(a.what)}</p>
      <div class="d-best"><span>Standout feature</span><p>${esc(a.best)}</p></div>
      <div class="d-cols">
        <div><h4>What it can do</h4><ul>${a.features.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="d-side">
          <div><h4>Started</h4><p class="d-big">${a.started}</p></div>
          <div><h4>Category</h4><p>${catName(a.cat)}</p></div>
          <div><h4>Built with</h4><div class="chips">${a.stack.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
        </div>
      </div>
      <a class="d-open" href="${a.url}" target="_blank" rel="noopener">${a.status==="Waitlist" ? "Join the waitlist" : "Open " + esc(a.name)} ${arrow}</a>
    </div>`;
  sheet.hidden = false; document.documentElement.style.overflow = "hidden";
  requestAnimationFrame(() => sheet.classList.add("on"));
  sheet.querySelector(".panel").focus();
}
function closeDetails(){
  sheet.classList.remove("on"); document.documentElement.style.overflow = "";
  setTimeout(() => { sheet.hidden = true; }, 220);
  if(lastFocus) lastFocus.focus();
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-more]"); if(m){ openDetails(+m.dataset.more); return; }
  if(e.target.closest("[data-close]")) closeDetails();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !sheet.hidden) closeDetails(); });

const live = APPS.filter(a => !a.status).length;
$("#stats").innerHTML =
  `<div class="stat"><b>${APPS.length}</b><span>Apps</span></div>
   <div class="stat"><b>${live}</b><span>Live now</span></div>
   <div class="stat"><b>Jul 2026</b><span>First ship</span></div>
   <a class="stat" href="https://github.com/M14Mason"><b>GitHub ↗</b><span>M14Mason</span></a>`;

let active = "all";
function render(){
  let i = 0, html = "";
  if(active === "all"){
    html += `<section aria-labelledby="h-feat"><div class="sec-head"><h2 id="h-feat">Start here</h2><p>The three I'm proudest of.</p></div><div class="feat">` +
      APPS.filter(a => a.feat).map(a => card(a, i++, true)).join("") + `</div></section>`;
  }
  html += CATS.filter(c => active === "all" || c.id === active).map(c => {
    const list = APPS.filter(a => a.cat === c.id && (active !== "all" || !a.feat));
    if(!list.length) return "";
    return `<section aria-labelledby="h-${c.id}"><div class="sec-head"><h2 id="h-${c.id}">${c.name}</h2><p>${c.blurb}</p></div><div class="grid">` +
      list.map(a => card(a, i++, false)).join("") + `</div></section>`;
  }).join("");
  $("#groups").innerHTML = html;
}
const f = $("#filters");
f.innerHTML = [{id:"all",name:"All"}, ...CATS].map(c => {
  const n = c.id==="all" ? APPS.length : APPS.filter(a=>a.cat===c.id).length;
  return `<button type="button" class="chip" id="f-${c.id}" data-id="${c.id}" aria-pressed="${c.id==="all"}">${c.name}<small>${n}</small></button>`;
}).join("");
f.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  active = b.dataset.id;
  f.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

// hero: a slow price line drawn behind the headline
(function(){
  const cv = $("#tape"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, pts = [], t = 0, raf;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    pts = []; let v = h*.62, s = 7;
    for(let x=0; x<=w+20; x+=6){ s = (s*9301+49297)%233280; v += (s/233280 - .5)*14 - (v - h*.55)*.02; pts.push(v); }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 1; ctx.globalAlpha = .6;
    for(let y=h*.2; y<h; y+=h*.2){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    const n = reduce ? pts.length : Math.min(pts.length, Math.floor(t));
    const c = css("--accent");
    ctx.globalAlpha = .45; ctx.strokeStyle = c; ctx.lineWidth = 1.6; ctx.beginPath();
    for(let i=0;i<n;i++){ const x=i*6, y=pts[i] + (reduce?0:Math.sin((i+t)*.04)*2); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    if(n>1){ ctx.globalAlpha=1; ctx.fillStyle=c; ctx.beginPath(); ctx.arc((n-1)*6,pts[n-1],3,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
    if(!reduce){ t += t < pts.length ? 2.2 : .35; raf = requestAnimationFrame(draw); }
  }
  size(); draw();
  let to; addEventListener("resize", () => { clearTimeout(to); to = setTimeout(() => { cancelAnimationFrame(raf); size(); t = pts.length; draw(); }, 150); });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if(!document.hidden && !reduce) draw(); });
})();
</script>
